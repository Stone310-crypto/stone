name: Create Release (All Platforms)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (z.B. v0.1.0)'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Node Binaries ────────────────────────────────────────────────────
  build-node-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build binaries
        run: |
          cargo build --release --bin stone-app-node --target ${{ matrix.target }}
          cargo build --release --bin stone-master --target ${{ matrix.target }}

      - name: Prepare and upload
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          NODE="stone-app-node-${{ matrix.suffix }}"
          MASTER="stone-master-${{ matrix.suffix }}"
          if [ -f stone-app-node.exe ]; then cp stone-app-node.exe "$NODE"; else cp stone-app-node "$NODE"; fi
          if [ -f stone-master.exe ]; then cp stone-master.exe "$MASTER"; else cp stone-master "$MASTER"; fi
          if [ "$(uname)" = "Darwin" ]; then shasum -a 256 "$NODE" | awk '{print $1}' > "$NODE.sha256"; shasum -a 256 "$MASTER" | awk '{print $1}' > "$MASTER.sha256"
          else sha256sum "$NODE" | awk '{print $1}' > "$NODE.sha256"; sha256sum "$MASTER" | awk '{print $1}' > "$MASTER.sha256"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: node-binaries-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/stone-app-node-${{ matrix.suffix }}
            target/${{ matrix.target }}/release/stone-app-node-${{ matrix.suffix }}.sha256
            target/${{ matrix.target }}/release/stone-master-${{ matrix.suffix }}
            target/${{ matrix.target }}/release/stone-master-${{ matrix.suffix }}.sha256

  # ── Dashboard macOS ──────────────────────────────────────────────────
  build-dashboard-macos:
    needs: build-node-binaries
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }

      - name: Enable updater artifacts
        run: |
          cd dashboard/src-tauri
          sed -i '' 's/"createUpdaterArtifacts": false/"createUpdaterArtifacts": true/' tauri.conf.json

      - run: cd dashboard && npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target ${{ matrix.target }}

      - name: Rename updater artifacts (include arch)
        shell: bash
        run: |
          cd dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/macos
          TAR="Stone Dashboard.app.tar.gz"
          SIG="Stone Dashboard.app.tar.gz.sig"
          DMG=$(ls *.dmg 2>/dev/null | head -1)
          if [ -f "$TAR" ]; then mv "$TAR" "Stone-Dashboard-${{ matrix.target }}.app.tar.gz"; fi
          if [ -f "$SIG" ]; then mv "$SIG" "Stone-Dashboard-${{ matrix.target }}.app.tar.gz.sig"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-macos-${{ matrix.target }}
          path: |
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.dmg
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Stone-Dashboard-*.app.tar.gz
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/macos/Stone-Dashboard-*.app.tar.gz.sig

  # ── Dashboard Windows ────────────────────────────────────────────────
  build-dashboard-windows:
    needs: build-node-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: Enable updater artifacts
        shell: bash
        run: |
          cd dashboard/src-tauri
          sed -i 's/"createUpdaterArtifacts": false/"createUpdaterArtifacts": true/' tauri.conf.json

      - run: cd dashboard && npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-windows-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ── Dashboard Linux ──────────────────────────────────────────────────
  build-dashboard-linux:
    needs: build-node-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Enable updater artifacts
        run: |
          cd dashboard/src-tauri
          sed -i 's/"createUpdaterArtifacts": false/"createUpdaterArtifacts": true/' tauri.conf.json

      - run: cd dashboard && npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target x86_64-unknown-linux-gnu

      - name: Rename updater artifacts (include arch)
        run: |
          cd dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          TAR="Stone Dashboard.AppImage.tar.gz"
          SIG="Stone Dashboard.AppImage.tar.gz.sig"
          if [ -f "$TAR" ]; then mv "$TAR" "Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz"; fi
          if [ -f "$SIG" ]; then mv "$SIG" "Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz.sig"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-linux-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/Stone-Dashboard-*.AppImage.tar.gz
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/Stone-Dashboard-*.AppImage.tar.gz.sig

  # ── Create GitHub Release ──────────────────────────────────────────
  create-release:
    needs:
      - build-node-binaries
      - build-dashboard-macos
      - build-dashboard-windows
      - build-dashboard-linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true

      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: List assets for debugging
        run: find assets -type f | sort

      - name: Generate versions.json
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          VERSION="${TAG#v}"
          DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BASE="https://github.com/Stone310-crypto/stone/releases/download/${TAG}"

          # macOS signatures
          MAC_AARCH64_SIG=""
          MAC_X86_64_SIG=""
          if [ -f "assets/Stone-Dashboard-aarch64-apple-darwin.app.tar.gz.sig" ]; then
            MAC_AARCH64_SIG=$(cat "assets/Stone-Dashboard-aarch64-apple-darwin.app.tar.gz.sig")
          fi
          if [ -f "assets/Stone-Dashboard-x86_64-apple-darwin.app.tar.gz.sig" ]; then
            MAC_X86_64_SIG=$(cat "assets/Stone-Dashboard-x86_64-apple-darwin.app.tar.gz.sig")
          fi
          LINUX_SIG=""
          if [ -f "assets/Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz.sig" ]; then
            LINUX_SIG=$(cat "assets/Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz.sig")
          fi

          cat > assets/versions.json << JSONEOF
          {
            "version": "${VERSION}",
            "notes": "Release ${TAG} — https://github.com/Stone310-crypto/stone/releases/tag/${TAG}",
            "pub_date": "${DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_AARCH64_SIG}",
                "url": "${BASE}/Stone-Dashboard-aarch64-apple-darwin.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X86_64_SIG}",
                "url": "${BASE}/Stone-Dashboard-x86_64-apple-darwin.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "",
                "url": "${BASE}/Stone-Dashboard_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE}/Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz"
              }
            }
          }
          JSONEOF

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          files: assets/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
