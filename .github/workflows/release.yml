name: Create Release (All Platforms)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag'
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build-node-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --release --bin stone-app-node --target ${{ matrix.target }}
      - run: cargo build --release --bin stone-master --target ${{ matrix.target }}
      - name: Rename and upload
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          N="stone-app-node-${{ matrix.suffix }}"; M="stone-master-${{ matrix.suffix }}"
          if [ -f stone-app-node.exe ]; then cp stone-app-node.exe "$N"; else cp stone-app-node "$N"; fi
          if [ -f stone-master.exe ]; then cp stone-master.exe "$M"; else cp stone-master "$M"; fi
          if [ "$(uname)" = "Darwin" ]; then shasum -a 256 "$N"|awk '{print $1}'>"$N.sha256"; shasum -a 256 "$M"|awk '{print $1}'>"$M.sha256"
          else sha256sum "$N"|awk '{print $1}'>"$N.sha256"; sha256sum "$M"|awk '{print $1}'>"$M.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: node-binaries-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/stone-app-node-${{ matrix.suffix }}
            target/${{ matrix.target }}/release/stone-app-node-${{ matrix.suffix }}.sha256
            target/${{ matrix.target }}/release/stone-master-${{ matrix.suffix }}
            target/${{ matrix.target }}/release/stone-master-${{ matrix.suffix }}.sha256

  build-dashboard-macos-aarch64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - run: cd dashboard && npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target aarch64-apple-darwin
      - name: Rename artifacts
        run: |
          cd dashboard/src-tauri/target/aarch64-apple-darwin/release/bundle/macos
          if [ -f "Stone Dashboard.app.tar.gz" ]; then mv "Stone Dashboard.app.tar.gz" "Stone-Dashboard-aarch64-apple-darwin.app.tar.gz"; fi
          if [ -f "Stone Dashboard.app.tar.gz.sig" ]; then mv "Stone Dashboard.app.tar.gz.sig" "Stone-Dashboard-aarch64-apple-darwin.app.tar.gz.sig"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-macos-aarch64
          path: |
            dashboard/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.dmg
            dashboard/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz
            dashboard/src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-dashboard-macos-x86_64:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin
      - run: cd dashboard && npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target x86_64-apple-darwin
      - name: Rename artifacts
        run: |
          cd dashboard/src-tauri/target/x86_64-apple-darwin/release/bundle/macos
          if [ -f "Stone Dashboard.app.tar.gz" ]; then mv "Stone Dashboard.app.tar.gz" "Stone-Dashboard-x86_64-apple-darwin.app.tar.gz"; fi
          if [ -f "Stone Dashboard.app.tar.gz.sig" ]; then mv "Stone Dashboard.app.tar.gz.sig" "Stone-Dashboard-x86_64-apple-darwin.app.tar.gz.sig"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-macos-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.dmg
            dashboard/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz
            dashboard/src-tauri/target/x86_64-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  build-dashboard-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - run: cd dashboard && npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target x86_64-pc-windows-msvc
      - name: Rename Windows artifacts (remove spaces)
        shell: bash
        run: |
          cd dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis
          for f in *.exe; do
            newname=$(echo "$f" | sed 's/ /-/g')
            if [ "$f" != "$newname" ]; then mv "$f" "$newname"; fi
          done
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-windows-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  build-dashboard-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev
      - run: cd dashboard && npm install
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
        with:
          projectPath: dashboard
          args: --target x86_64-unknown-linux-gnu
      - name: Rename artifacts
        run: |
          cd dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage
          if [ -f "Stone Dashboard.AppImage.tar.gz" ]; then mv "Stone Dashboard.AppImage.tar.gz" "Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz"; fi
          if [ -f "Stone Dashboard.AppImage.tar.gz.sig" ]; then mv "Stone Dashboard.AppImage.tar.gz.sig" "Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz.sig"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard-linux-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/rpm/*.rpm
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig

  create-release:
    needs:
      - build-node-binaries
      - build-dashboard-macos-aarch64
      - build-dashboard-macos-x86_64
      - build-dashboard-windows
      - build-dashboard-linux
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_UPDATER_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_UPDATER_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: Determine tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "TAG=${{ github.event.inputs.tag }}" >> $GITHUB_OUTPUT
          else
            echo "TAG=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi
      - name: Flatten assets into release dir
        run: |
          mkdir -p release
          find assets -type f | while read -r f; do
            base=$(basename "$f")
            if [ -f "release/$base" ]; then
              cp "$f" "release/$(echo "$f" | tr '/' '_')"
            else
              cp "$f" "release/$base"
            fi
          done
          echo "=== Release files ==="
          find release -type f | sort
      - name: Setup Node for signing
        run: cd dashboard && npm install
      - name: Sign all updater artifacts (fallback if .sig missing)
        run: |
          cd dashboard
          # Write private key to temp file
          echo "${TAURI_SIGNING_PRIVATE_KEY}" > /tmp/updater.key
          # Sign each updater artifact that lacks a .sig file
          for f in ../release/Stone-Dashboard-*.app.tar.gz ../release/Stone-Dashboard-*.AppImage.tar.gz ../release/Stone-Dashboard_*_x64-setup.exe; do
            [ -f "$f" ] || continue
            SIG="${f}.sig"
            if [ ! -f "$SIG" ]; then
              echo "Generating signature for: $(basename $f)"
              npx tauri signer sign --private-key /tmp/updater.key --password "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD}" "$f" || {
                echo "WARNING: Failed to sign $f — trying without password"
                npx tauri signer sign --private-key /tmp/updater.key "$f" || echo "ERROR: Signing failed for $f"
              }
            else
              echo "Signature exists: $(basename $SIG)"
            fi
          done
          rm -f /tmp/updater.key
      - name: Generate versions.json
        run: |
          TAG="${{ steps.tag.outputs.TAG }}"
          VERSION="${TAG#v}"
          BASE="https://github.com/Stone310-crypto/stone/releases/download/${TAG}"
          # Read signatures from release/ dir (flattened)
          MAC_ARM_SIG=""; MAC_X86_SIG=""; LINUX_SIG=""; WIN_SIG=""
          [ -f "release/Stone-Dashboard-aarch64-apple-darwin.app.tar.gz.sig" ] && MAC_ARM_SIG=$(cat "release/Stone-Dashboard-aarch64-apple-darwin.app.tar.gz.sig" | tr -d '\n\r')
          [ -f "release/Stone-Dashboard-x86_64-apple-darwin.app.tar.gz.sig" ] && MAC_X86_SIG=$(cat "release/Stone-Dashboard-x86_64-apple-darwin.app.tar.gz.sig" | tr -d '\n\r')
          [ -f "release/Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz.sig" ] && LINUX_SIG=$(cat "release/Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz.sig" | tr -d '\n\r')
          # Windows signature — find the .sig we just generated
          WIN_SIG_FILE=$(find release -name "Stone-Dashboard_*_x64-setup.exe.sig" -print -quit)
          [ -n "$WIN_SIG_FILE" ] && WIN_SIG=$(cat "$WIN_SIG_FILE" | tr -d '\n\r')
          echo "MAC_ARM_SIG length: ${#MAC_ARM_SIG}"
          echo "MAC_X86_SIG length: ${#MAC_X86_SIG}"
          echo "LINUX_SIG length: ${#LINUX_SIG}"
          echo "WIN_SIG length: ${#WIN_SIG}"
          cat > release/versions.json << JSONEOF
          {
            "version": "${VERSION}",
            "notes": "Release ${TAG}",
            "pub_date": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${MAC_ARM_SIG}",
                "url": "${BASE}/Stone-Dashboard-aarch64-apple-darwin.app.tar.gz"
              },
              "darwin-x86_64": {
                "signature": "${MAC_X86_SIG}",
                "url": "${BASE}/Stone-Dashboard-x86_64-apple-darwin.app.tar.gz"
              },
              "windows-x86_64": {
                "signature": "${WIN_SIG}",
                "url": "${BASE}/Stone-Dashboard_${VERSION}_x64-setup.exe"
              },
              "linux-x86_64": {
                "signature": "${LINUX_SIG}",
                "url": "${BASE}/Stone-Dashboard-x86_64-unknown-linux-gnu.AppImage.tar.gz"
              }
            }
          }
          JSONEOF
          echo "=== versions.json ==="
          cat release/versions.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.TAG }}
          name: ${{ steps.tag.outputs.TAG }}
          files: release/*
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
