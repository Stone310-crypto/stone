name: Build Dashboard + Node Binaries (All Platforms)
on:
  push:
    branches: [main, master]
    paths:
      - 'dashboard/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/build.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'dashboard/**'
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Node Binaries (all platforms) ──────────────────────────────────────
  build-node-binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build stone-app-node
        run: cargo build --release --bin stone-app-node --target ${{ matrix.target }}

      - name: Build stone-master
        run: cargo build --release --bin stone-master --target ${{ matrix.target }}

      - name: Prepare & rename binaries
        shell: bash
        run: |
          cd target/${{ matrix.target }}/release
          NODE="stone-app-node-${{ matrix.suffix }}"
          MASTER="stone-master-${{ matrix.suffix }}"
          if [ -f stone-app-node.exe ]; then cp stone-app-node.exe "$NODE"; else cp stone-app-node "$NODE"; fi
          if [ -f stone-master.exe ]; then cp stone-master.exe "$MASTER"; else cp stone-master "$MASTER"; fi
          if [ "$(uname)" = "Darwin" ]; then
            shasum -a 256 "$NODE" | awk '{print $1}' > "$NODE.sha256"
            shasum -a 256 "$MASTER" | awk '{print $1}' > "$MASTER.sha256"
          else
            sha256sum "$NODE" | awk '{print $1}' > "$NODE.sha256"
            sha256sum "$MASTER" | awk '{print $1}' > "$MASTER.sha256"
          fi

      - name: Upload node binaries
        uses: actions/upload-artifact@v4
        with:
          name: node-binaries-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/stone-app-node-${{ matrix.suffix }}
            target/${{ matrix.target }}/release/stone-app-node-${{ matrix.suffix }}.sha256
            target/${{ matrix.target }}/release/stone-master-${{ matrix.suffix }}
            target/${{ matrix.target }}/release/stone-master-${{ matrix.suffix }}.sha256

  # ── Dashboard macOS ──────────────────────────────────────────────────
  build-dashboard-macos:
    needs: build-node-binaries
    strategy:
      matrix:
        target: [aarch64-apple-darwin, x86_64-apple-darwin]
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: ${{ matrix.target }} }

      - name: Install deps
        run: cd dashboard && npm ci

      - name: Build Tauri (macOS)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          args: --target ${{ matrix.target }}

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-macos-${{ matrix.target }}
          path: |
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            dashboard/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

  # ── Dashboard Windows ────────────────────────────────────────────────
  build-dashboard-windows:
    needs: build-node-binaries
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: x86_64-pc-windows-msvc }

      - name: Install deps
        run: cd dashboard && npm ci

      - name: Build Tauri (Windows)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          args: --target x86_64-pc-windows-msvc

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-windows-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            dashboard/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe

  # ── Dashboard Linux ──────────────────────────────────────────────────
  build-dashboard-linux:
    needs: build-node-binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: dtolnay/rust-toolchain@stable

      - name: Install system deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev

      - name: Install deps
        run: cd dashboard && npm ci

      - name: Build Tauri (Linux)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: dashboard
          args: --target x86_64-unknown-linux-gnu

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-linux-x86_64
          path: |
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz
            dashboard/src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.tar.gz.sig
