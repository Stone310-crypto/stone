<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Node Dashboard</title><style>
:root{--bg:#0f1117;--panel:#1a1c26;--border:rgba(255,255,255,0.08);--text:#e8e4df;--text2:#b8b4ae;--muted:#6e6b65;--acc:#d4a853;--green:#5a9e6f;--red:#d95b5b;--blue:#6b9cc4;--amber:#e0a845}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px;font-size:13px;line-height:1.5}
h1{font-size:18px;font-weight:700;margin-bottom:2px}
.sub{color:var(--text2);font-size:11px;margin-bottom:4px}
#debug-console{background:#000;border:1px solid #333;border-radius:8px;padding:10px;margin-bottom:12px;max-height:200px;overflow-y:auto;font-family:'SF Mono',Menlo,monospace;font-size:10px;line-height:1.5}
.d-ok{color:#5a9e6f}.d-err{color:#d95b5b}.d-info{color:#6b9cc4}.d-warn{color:#e0a845}.d-ts{color:#6e6b65;margin-right:6px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px;margin-bottom:12px}
.card{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:14px}
.card h3{font-size:12px;font-weight:600;color:var(--text2);margin-bottom:6px}
.card .value{font-size:24px;font-weight:700;font-family:monospace}
.card .label{font-size:10px;color:var(--muted)}
.bar-bg{height:8px;background:rgba(255,255,255,0.06);border-radius:4px;overflow:hidden;margin-top:6px}
.bar-fill{height:100%;border-radius:4px;transition:width .3s}
.bar-green{background:var(--green)}.bar-amber{background:var(--amber)}.bar-red{background:var(--red)}.bar-blue{background:var(--blue)}
.logs{background:#0a0a0a;border:1px solid var(--border);border-radius:10px;padding:12px;font-family:'SF Mono',Menlo,monospace;font-size:11px;color:#a0a0a0;max-height:200px;overflow-y:auto;white-space:pre-wrap;line-height:1.4;margin-top:8px}
.settings-row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid rgba(255,255,255,0.03)}
.settings-row:last-child{border:none}
.settings-label{flex:1;font-size:12px;color:var(--text2)}
.settings-input{width:80px;padding:4px 8px;border-radius:4px;background:rgba(255,255,255,0.06);border:1px solid var(--border);color:var(--text);font-size:12px;text-align:right;outline:none}
.btn{padding:5px 12px;border-radius:6px;border:none;font-size:11px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:4px}
.btn-primary{background:var(--acc);color:#000}.btn-secondary{background:var(--border);color:var(--text)}
</style></head><body>
<h1>📊 Node Dashboard</h1>
<p class="sub"><span id="bridge-status" style="font-size:10px;padding:2px 6px;border-radius:8px;background:rgba(239,68,68,0.15);color:#ef4444">🔴 Start</span></p>
<div id="debug-console"><div class="d-info">🐛 Debug-Console bereit...</div></div>

<!-- TEST: minimal inline script right here -->
<script>
(function(){
  var el=document.getElementById('debug-console');
  if(el)el.innerHTML+='<div class="d-ok">✅ TEST: inline &lt;script&gt; executed!</div>';
})();
</script>

<div class="grid">
<div class="card"><h3>🔗 Block Height</h3><div class="value" id="block-height">—</div></div>
<div class="card"><h3>👥 Peers</h3><div class="value" id="peers">—</div></div>
<div class="card"><h3>⏱️ Uptime</h3><div class="value" id="uptime">—</div></div>
<div class="card"><h3>📝 Mempool</h3><div class="value" id="mempool">—</div></div>
</div>

<h2 style="font-size:14px;font-weight:600;margin:12px 0 8px">💻 System</h2>
<div class="grid">
<div class="card"><h3>🖥️ CPU Gesamt</h3><div class="value" id="cpu-total">—</div></div>
<div class="card"><h3>🧠 RAM Gesamt</h3><div class="value" id="ram-total">—</div></div>
<div class="card"><h3>⚡ Stone App CPU</h3><div class="value" id="cpu-app">—</div></div>
<div class="card"><h3>💾 Stone App RAM</h3><div class="value" id="ram-app">—</div></div>
</div>

<div style="display:flex;align-items:center;gap:10px;margin:12px 0 4px">
<h2 style="font-size:14px;font-weight:600;margin:0">📜 Node Logs</h2>
<button class="btn btn-secondary" onclick="alert('click works')">🔄 Test-Button</button>
</div>
<div class="logs" id="logs">Lade Logs...</div>

<!-- MAIN SCRIPT -->
<script>
var dbg=document.getElementById('debug-console');
function D(m,c){var d=document.createElement('div');d.className=c||'d-info';d.textContent=m;dbg.appendChild(d);dbg.scrollTop=dbg.scrollHeight}
D('MAIN SCRIPT RUNNING','d-ok');
D('origin: '+window.location.origin);
D('parent===window: '+(window.parent===window));
D('__stone_invoke: '+typeof window.__stone_invoke);
try{D('parent.__TAURI__: '+typeof window.parent.__TAURI_INTERNALS__)}catch(e){D('parent.__TAURI__ error: '+e.message,'d-err')}
D('DONE - waiting for invoke test...','d-info');
</script>
</body></html>
